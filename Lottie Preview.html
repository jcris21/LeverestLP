<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap">
<style>body{margin:0;background:#0B0D0F}#a{width:100vw;height:52vw}#c{position:fixed;bottom:8px;left:8px;color:#fff;font:12px monospace}</style></head>
<body><div id="a"></div><div id="c"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
Promise.all([
  fetch('ai-leverage-scene.json').then(r=>r.json()),
  document.fonts.load('700 20px Poppins'),
  document.fonts.load('500 15px Poppins')
]).then(([d])=>document.fonts.ready.then(()=>{
  window.anim=lottie.loadAnimation({container:document.getElementById('a'),renderer:'svg',loop:false,autoplay:true,animationData:d});
  anim.addEventListener('enterFrame',()=>{document.getElementById('c').textContent='f'+Math.round(anim.currentFrame);});
}));
window.onerror=e=>{document.getElementById('c').textContent='ERR '+e;};
</script></body></html>
